name: Build IslandCN Pro v4.2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP from Google Drive
        run: |
          pip install -q gdown
          gdown "1uoGGF2YV6ZKf61c81t-JVYcoPiBa2LoS" -O IslandCN_Pro_v4.2_Smooth.zip
          unzip -q -o IslandCN_Pro_v4.2_Smooth.zip
          rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Run Unit Tests & Lint
        run: gradle testDebugUnitTest lint --no-daemon --stacktrace

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Stage APK Files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IslandCN-Pro-v4.2.0-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/IslandCN-Pro-v4.2.0-release-debug-signed.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IslandCN-Pro-v4.2.0-APKs
          path: dist/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.${{ github.run_number }}
          name: "IslandCN Pro v4.2 (Build #${{ github.run_number }})"
          body: "Smooth 120Hz spring morphing, crash fix, sticky USB/service notification fixes."
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
